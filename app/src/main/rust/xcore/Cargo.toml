[package]
name = "xcore"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
publish = false
description = "WinLite native core: the X11 server, the SysV SHM and ALSA (AAudio) guest services, pixel ops, shared memory, epoll I/O"

[lib]
# staticlib: linked into libwinlator.so by CMake.
crate-type = ["staticlib", "rlib"]

[dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
